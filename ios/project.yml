# XcodeGen spec for the Handstand iPhone app (chainlink #44).
#
# The .xcodeproj is GENERATED from this file and never committed
# (`ios/*.xcodeproj/` is in .gitignore), so this is the file to edit:
#
#     cd ios && xcodegen generate && open Handstand.xcodeproj
#
# Signing: CODE_SIGN_STYLE is Automatic (below); the team id is personal, so
# it is never committed — Base.xcconfig defaults it to empty and includes
# Config/Local.xcconfig (git-ignored) where the real id goes. See
# Config/Local.xcconfig.example and docs/ios.md.
name: Handstand

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# The app links HandstandCore — the package swift_test.sh builds and tests on
# the Mac — and VisionPoseKit (the Apple Vision PoseService backend, chainlink
# #82) as local dependencies. No network fetch, same sources as Linux.
packages:
  HandstandCore:
    path: ../swift/HandstandCore
  VisionPose:
    path: ../swift/VisionPose

# Applied to every target: CODE_SIGN_STYLE and the (empty by default)
# DEVELOPMENT_TEAM come from here, never from this file.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"

targets:
  HandstandApp:
    type: application
    platform: iOS
    sources:
      - path: HandstandApp
      # The user's scoring reference (chainlink #28) lives here — never in
      # git (`.gitignore`), so the folder is usually absent and the build
      # must work without it: `optional: true` skips it when missing, and
      # when present its files are bundled as resources, which is where
      # ReferenceLoader finds `reference-line.json`. See docs/ios.md.
      - path: LocalResources
        optional: true
        buildPhase: resources
    # The Info.plist itself is generated from this file by xcodegen (and is
    # git-ignored like the project); the camera / photo-library strings are
    # the ones the system shows in its permission prompts.
    info:
      path: HandstandApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Record your handstand attempts to analyse your form.
        NSPhotoLibraryAddUsageDescription: Save your annotated handstand video to Photos.
        NSPhotoLibraryUsageDescription: Choose a handstand video to analyse.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies:
      - package: HandstandCore
        product: HandstandCore
      - package: VisionPose
        product: VisionPoseKit
      - package: VisionPose
        product: AnnotatedVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanoccsafe.handstand
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HandstandAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HandstandAppTests
    dependencies:
      - target: HandstandApp
      - package: HandstandCore
        product: HandstandCore
      - package: VisionPose
        product: VisionPoseKit
      - package: VisionPose
        product: AnnotatedVideo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanoccsafe.handstand.HandstandAppTests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HandstandApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HandstandApp"
        # Chainlink #45: the test target is not a CocoaPods target (see
        # ios/Podfile — a nested pod target links a SECOND copy of MediaPipe
        # into the bundle and dyld aborts on the duplicate C++ registrations).
        # The tests never import the pod; these paths only let the compiler's
        # dependency scan resolve `MediaPipeTasksVision` when it loads
        # `HandstandApp.swiftmodule`. Same four -F flags CocoaPods' own
        # HandstandAppTests xcconfig would have handed out.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Pods/MediaPipeTasksCommon/frameworks $(SRCROOT)/Pods/MediaPipeTasksVision/frameworks $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/XCFrameworkIntermediates/MediaPipeTasksCommon $(BUILD_DIR)/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)/XCFrameworkIntermediates/MediaPipeTasksVision"

schemes:
  HandstandApp:
    build:
      targets:
        HandstandApp: all
        HandstandAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HandstandAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
